<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Search — Biblioteca</title>
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/PixelBlast.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos específicos para a página de biblioteca */
        .secao-biblioteca {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .cabecalho-pagina {
            margin-bottom: 30px;
            border-bottom: 1px solid var(--cor-borda);
            padding-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .cabecalho-pagina__titulo {
            font-family: var(--font-titulo);
            font-size: var(--fs-xl);
            color: var(--cor-texto-destaque);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(var(--cor-primaria-rgb), 0.5);
        }

        .cabecalho-pagina__descricao {
            font-family: var(--font-corpo);
            color: var(--cor-texto);
            font-size: var(--fs-sm);
            max-width: 600px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Ajustes na grade para a biblioteca - MANTENDO ORIGINAL */
        .grade-jogos {
            max-width: 1200px;
        }

        /* ─── ESTILOS DE PAGINAÇÃO APRIMORADOS ─────────────────────────────────── */
        
        .catalogo-paginacao {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            gap: 24px !important;
            margin: 50px auto !important;
            padding: 20px !important;
            background: rgba(15, 15, 35, 0.7) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4) !important;
            width: fit-content !important;
        }

        .catalogo-paginacao button {
            background: #1a1a3a !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.2) !important;
            padding: 12px 28px !important;
            border-radius: 12px !important;
            cursor: pointer !important;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif !important;
            font-weight: 700 !important;
            font-size: 13px !important;
            text-transform: uppercase !important;
            letter-spacing: 1.5px !important;
            display: flex !important;
            align-items: center !important;
            gap: 12px !important;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
            outline: none !important;
        }

        .catalogo-paginacao button:not(:disabled):hover {
            background: var(--cor-primaria, #6366f1) !important;
            border-color: var(--cor-primaria, #6366f1) !important;
            transform: translateY(-3px) !important;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.5) !important;
            color: var(--cor-texto-sobre-destaque) !important;
        }

        .catalogo-paginacao button:disabled {
            opacity: 0.2 !important;
            cursor: not-allowed !important;
            background: #0f0f25 !important;
            border-color: transparent !important;
        }

        #infoPagina {
            font-family: var(--font-titulo, 'Orbitron', sans-serif) !important;
            font-size: 12px !important;
            color: var(--cor-texto-destaque) !important;
            text-transform: uppercase !important;
            letter-spacing: 2px !important;
            font-weight: 800 !important;
            background: rgba(99, 102, 241, 0.1) !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            border: 1px solid rgba(99, 102, 241, 0.3) !important;
            min-width: 140px !important;
            text-align: center !important;
        }

        .catalogo-contador {
            text-align: center !important;
            margin-top: 15px !important;
            font-family: var(--font-corpo) !important;
            font-size: 11px !important;
            color: rgba(255, 255, 255, 0.5) !important;
            letter-spacing: 1px !important;
            text-transform: uppercase !important;
        }

        @media (max-width: 600px) {
            .catalogo-paginacao {
                flex-direction: column !important;
                width: 90% !important;
                gap: 15px !important;
            }
            .catalogo-paginacao button {
                width: 100% !important;
                justify-content: center !important;
            }
        }
    </style>
</head>

<body>
    <div class="layout-principal">

        <!-- Barra Lateral -->
        <aside class="barra-lateral" id="sidebarDrawer">
            <div class="sidebar-logo">
                <img src="../assets/img/logo2.png" alt="Game Search">
            </div>

            <!-- Navegação Principal -->
            <div class="sidebar-secao">
                <h3 class="sidebar-titulo">Navegação Principal</h3>
                <nav class="menu-navegacao">
                    <ul>
                        <li><a href="../index.html"><i class="fas fa-home"></i><span>Início</span></a></li>
                        <li class="ativo"><a href="biblioteca.html"><i class="fas fa-book"></i><span>Biblioteca</span></a></li>
                    </ul>
                </nav>
            </div>

            <!-- Informações -->
            <div class="sidebar-secao">
                <h3 class="sidebar-titulo">Informações</h3>
                <nav class="menu-navegacao">
                    <ul>
                        <li><a href="sobre.html"><i class="fas fa-users"></i><span>Sobre nós</span></a></li>
                    </ul>
                </nav>
            </div>

            <!-- Usuário -->
            <div class="sidebar-secao">
                <h3 class="sidebar-titulo">Usuário</h3>
                <nav class="menu-navegacao">
                    <ul>
                        <li><a href="login.html"><i class="fas fa-sign-in-alt"></i><span>Entrar</span></a></li>
                        <li><a href="perfil.html"><i class="fas fa-user"></i><span>Perfil</span></a></li>
                        <li><a href="configuracao.html"><i class="fas fa-cog"></i><span>Configurações</span></a></li>
                    </ul>
                </nav>
            </div>

            <!-- Suporte -->
            <div class="sidebar-secao">
                <h3 class="sidebar-titulo">Suporte</h3>
                <nav class="menu-navegacao">
                    <ul>
                        <li><a href="feedback.html"><i class="fas fa-envelope"></i><span>Feedback</span></a></li>
                        <li><a href="ajuda.html"><i class="fas fa-question-circle"></i><span>Ajuda</span></a></li>
                    </ul>
                </nav>
            </div>
        </aside>

        <!-- Overlay para fechar o drawer -->
        <div class="drawer-overlay" id="drawerOverlay"></div>

        <!-- Conteúdo Principal -->
        <main class="conteudo-principal">

            <header class="barra-superior">
                <div class="container-busca">
                    <i class="fas fa-search"></i>
                    <input type="text" placeholder="BUSCAR NA BIBLIOTECA" class="campo-busca" autocomplete="off">
                </div>
            </header>

            <!-- Breadcrumb -->
            <nav class="breadcrumb" aria-label="Navegação">
                <a href="../index.html"><i class="fas fa-home"></i> Início</a>
                <i class="fas fa-chevron-right"></i>
                <span>Biblioteca</span>
            </nav>

            <section class="secao-biblioteca">
                <header class="cabecalho-pagina">
                    <h1 class="cabecalho-pagina__titulo">Biblioteca de Jogos</h1>
                    <p class="cabecalho-pagina__descricao">Explore nossa coleção completa de títulos e encontre sua próxima aventura.</p>
                </header>

                <!-- Filtros -->
                <section class="secao-filtros" aria-label="Filtros de jogos">
                    <div class="barra-filtro">
                        <button class="botao-filtro-principal ativo" data-menu="menu-categorias" aria-haspopup="true">
                            <i class="fas fa-th-large"></i> todos
                        </button>
                        <button class="botao-filtro-principal" data-menu="menu-plataforma" aria-haspopup="true">
                            <i class="fas fa-gamepad"></i> plataforma
                        </button>
                        <button class="botao-filtro-principal" data-menu="menu-genero" aria-haspopup="true">
                            <i class="fas fa-ghost"></i> gênero
                        </button>
                        <button class="botao-filtro-principal" data-menu="menu-etaria" aria-haspopup="true">
                            <i class="fas fa-users"></i> classificação
                        </button>
                        <button class="botao-filtro-principal" data-menu="menu-ano" aria-haspopup="true">
                            <i class="fas fa-calendar-alt"></i> ano
                        </button>
                        <button class="botao-filtro-principal" data-menu="menu-preco" aria-haspopup="true">
                            <i class="fas fa-dollar-sign"></i> preço
                        </button>

                        <div id="menu-categorias" class="menu-flutuante" role="menu">
                            <button class="opcao-filtro selecionada" data-filtro="todos">todos</button>
                            <button class="opcao-filtro" data-filtro="ação">ação</button>
                            <button class="opcao-filtro" data-filtro="aventura">aventura</button>
                            <button class="opcao-filtro" data-filtro="rpg">rpg</button>
                            <button class="opcao-filtro" data-filtro="indie">indie</button>
                            <button class="opcao-filtro" data-filtro="estratégia">estratégia</button>
                            <button class="opcao-filtro" data-filtro="roguelike">roguelike</button>
                            <button class="opcao-filtro" data-filtro="esporte">esporte</button>
                            <button class="opcao-filtro" data-filtro="terror">terror</button>
                            <button class="opcao-filtro" data-filtro="multiplayer">multiplayer</button>
                        </div>

                        <div id="menu-plataforma" class="menu-flutuante" role="menu">
                            <button class="opcao-filtro selecionada" data-filtro="todos">todos</button>
                            <button class="opcao-filtro" data-filtro="pc">PC</button>
                            <button class="opcao-filtro" data-filtro="ps5">PlayStation 5</button>
                            <button class="opcao-filtro" data-filtro="xbox">Xbox</button>
                            <button class="opcao-filtro" data-filtro="mobile">Mobile</button>
                            <button class="opcao-filtro" data-filtro="switch">Switch</button>
                        </div>

                        <div id="menu-genero" class="menu-flutuante" role="menu">
                            <button class="opcao-filtro selecionada" data-filtro="todos">todos</button>
                            <button class="opcao-filtro" data-filtro="ação">ação</button>
                            <button class="opcao-filtro" data-filtro="sandbox">sandbox</button>
                            <button class="opcao-filtro" data-filtro="simulação">simulação</button>
                            <button class="opcao-filtro" data-filtro="terror">terror</button>
                            <button class="opcao-filtro" data-filtro="social">social</button>
                            <button class="opcao-filtro" data-filtro="esporte">esporte</button>
                            <button class="opcao-filtro" data-filtro="roguelike">roguelike</button>
                            <button class="opcao-filtro" data-filtro="estratégia">estratégia</button>
                        </div>

                        <div id="menu-etaria" class="menu-flutuante" role="menu">
                            <button class="opcao-filtro selecionada" data-filtro="todos">todos</button>
                            <button class="opcao-filtro" data-filtro="L">Livre</button>
                            <button class="opcao-filtro" data-filtro="10">10+</button>
                            <button class="opcao-filtro" data-filtro="12">12+</button>
                            <button class="opcao-filtro" data-filtro="14">14+</button>
                            <button class="opcao-filtro" data-filtro="16">16+</button>
                            <button class="opcao-filtro" data-filtro="18">18+</button>
                        </div>

                        <div id="menu-ano" class="menu-flutuante" role="menu">
                            <button class="opcao-filtro selecionada" data-filtro="todos">todos</button>
                            <button class="opcao-filtro" data-filtro="2024">2024</button>
                            <button class="opcao-filtro" data-filtro="2023">2023</button>
                            <button class="opcao-filtro" data-filtro="2022">2022</button>
                            <button class="opcao-filtro" data-filtro="2021">2021</button>
                            <button class="opcao-filtro" data-filtro="2020">2020</button>
                        </div>

                        <div id="menu-preco" class="menu-flutuante" role="menu">
                            <button class="opcao-filtro selecionada" data-filtro="todos">todos</button>
                            <button class="opcao-filtro" data-filtro="gratis">Gratuito</button>
                            <button class="opcao-filtro" data-filtro="baixo">Até R$ 50</button>
                            <button class="opcao-filtro" data-filtro="medio">R$ 50 - R$ 150</button>
                            <button class="opcao-filtro" data-filtro="alto">Acima de R$ 150</button>
                        </div>
                    </div>
                </section>

                <!-- Grade de Jogos -->
                <section class="grade-jogos" id="gradeJogosBiblioteca" aria-label="Jogos disponíveis">
                    <!-- Renderizado via biblioteca.js -->
                </section>
                
                <div class="catalogo-contador" id="catalogoContador"></div>

                <!-- Paginação -->
                <div class="catalogo-paginacao" id="catalogoPaginacao">
                    <button id="btnPaginaAnterior" disabled><i class="fas fa-chevron-left"></i> Anterior</button>
                    <span id="infoPagina">Página 1 de 1</span>
                    <button id="btnPaginaProxima" disabled>Próxima <i class="fas fa-chevron-right"></i></button>
                </div>
            </section>
        </main>
    </div>

    <!-- Overlay do Card Expandido -->
    <div class="card-overlay" id="cardOverlay"></div>

    <!-- Botão Hambúrguer -->
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Abrir menu" aria-expanded="false">
        <i class="fas fa-bars"></i>
    </button>

    <script src="../assets/js/global.js"></script>
    <script src="../assets/js/filtros-jogos.js"></script>
    <script src="../assets/js/pages/biblioteca.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../assets/js/PixelBlast.js"></script>
</body>

</html>
